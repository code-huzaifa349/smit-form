<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form - Saylani</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;

        /* Saari cheezen center mein lane ke liye */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        padding: 40px;
        margin: 0;
        min-height: 100vh;
    }

    .form-table {
        background-color: #d3d3d3;
        border: 1px solid #ccc;
        padding: 20px;
        width: 550px;
        border-collapse: collapse;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="tel"],
    select,
    textarea {
        width: 95%;
        padding: 8px;
        margin: 5px 0;
        box-sizing: border-box;
    }

    #hobbies {
        height: 80px;
    }
</style>

</head>

<body>

    <!-- IMAGE CENTER -->
    <img src="Adobe Express - file.png" style="width: 360px; display: block; margin: 0 auto;">

    <h2><strong>Saylani Online Academy</strong></h2>

    <form action="thanks.html">

        <table class="form-table">
            <tr>
                <td colspan="2" style="text-align: center;">
                    <h1>Student Registration Form</h1>
                </td>
            </tr>

            <tr>
                <td><b>Name:</b></td>
                <td><input type="text" placeholder="Name" required></td>
            </tr>

            <tr>
                <td><b>Father Name:</b></td>
                <td><input type="text" placeholder="Father Name" required></td>
            </tr>

            <tr>
                <td><b>Password:</b></td>
                <td><input type="password" placeholder="********" required></td>
            </tr>

            <tr>
                <td style="vertical-align: top;"><b>Address:</b></td>
                <td><textarea placeholder="Address"></textarea></td>
            </tr>

            <tr>
                <td><b>Gender:</b></td>
                <td>
                    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
                </td>
            </tr>

            <tr>
                <td><b>Language:</b></td>
                <td>
                    <input type="checkbox" id="Urdu" value="Urdu"> <label for="Urdu">Urdu</label>
                    <input type="checkbox" id="English" value="English"> 
                    <label for="English">English</label>
                    <input type="checkbox" id="Arabic" value="Arabic">
                    <label for="Arabic">Arabic</label> 
                    <input type="checkbox" id="Chinese" value="Chinese">
                    <label for="Chinese">Chinese</label> 
                </td>
            </tr>

            <tr>
                <td><b>DOB:</b></td>
                <td><input type="text" placeholder="mm/dd/yyyy"></td>
            </tr>

            <tr>
                <td><b>Email ID:</b></td>
                <td><input type="email" placeholder="Email"></td>
            </tr>

            <tr>
                <td><b>Mobile:</b></td>
                <td><input type="tel" placeholder="Mobile Number"></td>
            </tr>

            <tr>
                <td><b>City:</b></td>
                <td>
                    <select>
                        <option>Select City</option>
                        <option>Karachi</option>
                        <option>Lahore</option>
                        <option>Hyderabad</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td "><b>Hobbies:</b></td>
                <td>
                    <select >
                        <option>Cricket</option>
                        <option>Football</option>
                        <option>Hockey</option>
                        <option>Tennis</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><b>Upload Picture:</b></td>
                <td>
                    <input type="file">
                    <button type="button">Upload</button>
                </td>
            </tr>
<br>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <button type="submit" <--!style="padding:10px 30px; background:#007bff; color:white; border:none; border-radius:4px;">
                        Submit Form
                    </button>
                </td>
            </tr>

        </table>
    </form>

</body>
</html>
